    <!-- Avapilt menüü all - vastu päist -->
    <div class="page-container" style="margin: 0 auto; padding: 0 24px;">
        <img id="mainImage" src="avaleht3.png" alt="ETK avaleht 3" style="width: 100%; height: auto; display: block; margin: 0; cursor: pointer;">
    </div>

    <!-- Modaalaken -->
    <div id="modal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 15px; max-width: 95%; max-height: 95%; width: 800px; cursor: pointer;" onclick="window.location.href='minutootukassa.html'">
            <span style="position: absolute; top: 15px; right: 20px; font-size: 32px; font-weight: bold; cursor: pointer;" onclick="event.stopPropagation(); document.getElementById('modal').style.display='none'">&times;</span>
            <img src="mobiilid.png" alt="Mobiil-ID" style="width: 100%; height: auto; max-width: 750px;">
            <p style="text-align: center; margin-top: 15px; color: var(--primary-color); font-weight: 600;">Klõpsake sisenemisel Minu Töötukassa</p>
        </div>
    </div>

    <script>
        // Lihtne click handler
        document.addEventListener('DOMContentLoaded', function() {
            const img = document.getElementById('mainImage');
            const modal = document.getElementById('modal');
            
            img.onclick = function() {
                modal.style.display = 'block';
            };
            
            // Sulge modal klõpsates taustal
            modal.onclick = function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            };
        });
    </script>
    
    <script src="script.js"></script>
